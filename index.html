<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weeping & Reaping</title>
  <style>
    :root {
      --bg-color: #0c0c0e;
      --card-bg: #16161a;
      --accent-red: #9e1b1b;
      --accent-red-bright: #ff3b3b;
      --text-main: #e0e0e0;
      --text-muted: #888888;
      --border-color: #2a2a30;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .container {
      max-width: 600px;
      width: 100%;
    }

    h1 {
      text-align: center;
      color: var(--accent-red-bright);
      letter-spacing: 3px;
      font-size: 1.5rem;
      text-transform: uppercase;
      border-bottom: 1px solid var(--accent-red);
      padding-bottom: 8px;
    }

    /* Lock Screen Overlay */
    #lock-screen {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: var(--bg-color);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
    }

    .pin-input {
      background: var(--card-bg);
      border: 1px solid var(--accent-red);
      color: #fff;
      font-size: 1.25rem;
      padding: 10px;
      text-align: center;
      letter-spacing: 5px;
      border-radius: 6px;
      margin-top: 15px;
      width: 160px;
    }

    .nav-tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    .tab-btn {
      flex: 1;
      padding: 10px;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
    }

    .tab-btn.active {
      border-color: var(--accent-red-bright);
      background: var(--accent-red);
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 16px;
    }

    .section-title {
      font-size: 0.9rem;
      text-transform: uppercase;
      color: var(--accent-red-bright);
      margin-bottom: 10px;
      letter-spacing: 1px;
    }

    .mood-category {
      margin-bottom: 16px;
    }

    .mood-category-label {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-bottom: 6px;
      font-style: italic;
    }

    .scale-group {
      display: flex;
      justify-content: space-between;
      gap: 8px;
    }

    .scale-btn {
      flex: 1;
      padding: 12px 0;
      background: #202026;
      border: 1px solid var(--border-color);
      color: var(--text-main);
      border-radius: 50%;
      aspect-ratio: 1;
      cursor: pointer;
      font-weight: bold;
    }

    .scale-btn.selected {
      background: var(--accent-red);
      border-color: var(--accent-red-bright);
      box-shadow: 0 0 8px rgba(255, 59, 59, 0.4);
    }

    .tag-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .tag {
      padding: 6px 12px;
      background: #202026;
      border: 1px solid var(--border-color);
      border-radius: 20px;
      font-size: 0.85rem;
      cursor: pointer;
      user-select: none;
    }

    .tag.selected {
      border-color: var(--accent-red-bright);
      color: #fff;
      background: #380b0b;
    }

    .grid-container { overflow-x: auto; }

    .monthly-grid {
      display: grid;
      grid-template-columns: 80px repeat(31, 24px);
      gap: 2px;
      font-size: 0.75rem;
    }

    .grid-cell {
      height: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #1a1a20;
      border-radius: 2px;
    }

    .cell-header { font-weight: bold; color: var(--text-muted); }
    .val-1 { background: #22222a; }
    .val-2 { background: #4a1515; }
    .val-3 { background: #7a1b1b; }
    .val-4 { background: #ad1e1e; }
    .val-5 { background: #ff3b3b; color: #000; font-weight: bold; }

    button.save-btn {
      width: 100%;
      padding: 14px;
      background: var(--accent-red);
      border: none;
      color: #fff;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 10px;
    }

    .button-group {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    .export-btn {
      flex: 1;
      padding: 14px;
      background: #4a4a52;
      border: none;
      color: #fff;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .export-btn:hover {
      background: #5a5a62;
    }

    /* Hide Netlify Badge */
    [data-netlify-badge] {
      display: none !important;
    }
    .netlify-badge {
      display: none !important;
    }
  </style>
</head>
<body>

<!-- SECURITY LOCK SCREEN -->
<div id="lock-screen">
  <h2 style="color: var(--accent-red-bright); letter-spacing: 2px;">RESTRICTED ACCESS</h2>
  <p style="color: var(--text-muted);">Enter PIN Passcode</p>
  <input type="password" id="pin-code" class="pin-input" maxlength="6" oninput="checkPin(this.value)" onkeydown="if(event.key==='Enter'){checkPin(this.value)}">
  <div style="margin-top:10px;">
    <button style="padding:8px 12px; border-radius:6px; background:#4a4a52; color:#fff; border:none; cursor:pointer;" onclick="checkPin(document.getElementById('pin-code').value)">Unlock</button>
    <button style="padding:8px 12px; border-radius:6px; background:#333; color:#fff; border:none; cursor:pointer; margin-left:8px;" onclick="forceUnlock()">Unlock (dev)</button>
  </div>
</div>

<div class="container" id="app-content" style="display: none;">
  <h1>Weeping & Reaping</h1>

  <div class="nav-tabs">
    <button class="tab-btn active" onclick="switchTab('daily')">Daily Log</button>
    <button class="tab-btn" onclick="switchTab('monthly')">Monthly Matrix</button>
  </div>

  <div id="daily-view">
    <div class="card">
      <div class="section-title">Date</div>
      <input type="date" id="entry-date" style="width: 100%; padding: 8px; background: #202026; color: #fff; border: 1px solid var(--border-color); border-radius: 4px;">
    </div>

    <div class="card">
      <div class="section-title">Mood Scale (1-5)</div>
      <div class="scale-group" id="mood-scale">
        <button class="scale-btn" onclick="selectSingle('mood-scale', 1)">1</button>
        <button class="scale-btn" onclick="selectSingle('mood-scale', 2)">2</button>
        <button class="scale-btn" onclick="selectSingle('mood-scale', 3)">3</button>
        <button class="scale-btn" onclick="selectSingle('mood-scale', 4)">4</button>
        <button class="scale-btn" onclick="selectSingle('mood-scale', 5)">5</button>
      </div>
    </div>

    <div class="card">
      <div class="section-title">Mood Adjectives</div>
      
      <div class="mood-category">
        <div class="mood-category-label">Sad / Low / Hurt</div>
        <div class="tag-grid" id="mood-sad">
          <span class="tag" onclick="toggleMulti(this)">Heavy</span>
          <span class="tag" onclick="toggleMulti(this)">Gloomy</span>
          <span class="tag" onclick="toggleMulti(this)">Hopeless</span>
          <span class="tag" onclick="toggleMulti(this)">Lonely</span>
          <span class="tag" onclick="toggleMulti(this)">Defeated</span>
          <span class="tag" onclick="toggleMulti(this)">Numb</span>
          <span class="tag" onclick="toggleMulti(this)">Apathetic</span>
        </div>
      </div>

      <div class="mood-category">
        <div class="mood-category-label">Anger / Frustrated</div>
        <div class="tag-grid" id="mood-anger">
          <span class="tag" onclick="toggleMulti(this)">Short-fused</span>
          <span class="tag" onclick="toggleMulti(this)">Irritable</span>
          <span class="tag" onclick="toggleMulti(this)">Resentful</span>
          <span class="tag" onclick="toggleMulti(this)">Annoyed</span>
          <span class="tag" onclick="toggleMulti(this)">Mad</span>
        </div>
      </div>

      <div class="mood-category">
        <div class="mood-category-label">Anxious / Fearful</div>
        <div class="tag-grid" id="mood-anxious">
          <span class="tag" onclick="toggleMulti(this)">Tense</span>
          <span class="tag" onclick="toggleMulti(this)">On-Edge</span>
          <span class="tag" onclick="toggleMulti(this)">Overwhelmed</span>
          <span class="tag" onclick="toggleMulti(this)">Panicky</span>
          <span class="tag" onclick="toggleMulti(this)">Worried</span>
        </div>
      </div>
